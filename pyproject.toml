[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kadr"
version = "0.1.0"
description = "Multi-monitor Wayland screenshot tool with annotation layers, numbered marks and editable history"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Sendem" }]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.5"]

[project.scripts]
kadr = "kadr.__main__:main"

[tool.setuptools]
packages = ["kadr"]

[tool.setuptools.package-data]
kadr = ["locales/*.json"]
